project:
  type: website
  output-dir: docs
  resources:
    # Keep the data files linked from posts served from the site, even when the
    # only post linking to them is a draft and Quarto stops copying them.
    - 0_data/*.csv
    # The internal cohort versions are needed to render but never published; the
    # 0_data/*_internal.csv gitignore rule does not reach docs/0_data/.
    - "!0_data/*_internal.csv"

website:
  title: "Michael Schulte-Mecklenbeck"
  favicon: images/favicon.png
  navbar:
    right:
      - text: 'Blog'
        file: 'index.qmd'
      - about.qmd
      - text: 'CV'
        href: '_content/_pdf/CV_Index.pdf'
      - text: 'Publications'
        file: 'research.qmd'
  page-footer: "© 2026 Michael Schulte-Mecklenbeck"

format:
  html:
    include-in-header: "gtag.js"
    theme: spacelab
    css: styles.css

editor: source
